# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py314"

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
]

[lint.per-file-ignores]
# Tests are held to a looser standard than the integration code, mirroring
# home-assistant/core's own tests/* ignores.
"tests/*" = [
    "S101",    # asserts are the point of a test
    "ANN",     # annotating every test function/fixture adds noise
    "D",       # docstrings are not required on test functions
    "INP001",  # tests/ is collected by pytest, not imported as a package
    "DTZ",     # naive datetimes are fine in fixtures
    "ARG",     # pytest fixtures arrive as unused-looking arguments
    "PLR2004", # magic values are normal in assertions
    "SLF001",  # tests deliberately reach into private scheduler state
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25
